steps:
  # Step 1: Build container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/vinyl-vault-repo/vinyl-vault:$SHORT_SHA',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/vinyl-vault-repo/vinyl-vault:latest',
      '.'
    ]

  # Step 2: Push container image tag and latest to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/vinyl-vault-repo/vinyl-vault:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/vinyl-vault-repo/vinyl-vault:latest']

  # Step 3: Deploy to Cloud Run in asia-east2 (Hong Kong)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'vinyl-vault-hk',
      '--image', 'us-central1-docker.pkg.dev/$PROJECT_ID/vinyl-vault-repo/vinyl-vault:$SHORT_SHA',
      '--region', 'asia-east2',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--set-env-vars', 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global'
    ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/vinyl-vault-repo/vinyl-vault:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/vinyl-vault-repo/vinyl-vault:latest'

timeout: '1200s'
